
<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="455"
     viewBox="0 0 1180 455"
     role="img"
     aria-label="guoxu AI research introduction">

  <title>guoxu - Claude inspired introduction</title>

  <defs>
    <!-- 第一行：分段流式显示 -->
    <clipPath id="reveal1">
      <rect x="72" y="222" width="0" height="65">
        <animate
          attributeName="width"
          values="0;45;91;136;182;227;272;318;341;363;386"
          keyTimes="0;0.09;0.18;0.27;0.39;0.48;0.56;0.68;0.81;0.92;1"
          calcMode="discrete"
          begin="0.65s"
          dur="1.65s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <!-- 第二行：模拟不均匀的 Token 输出 -->
    <clipPath id="reveal2">
      <rect x="72" y="286" width="0" height="65">
        <animate
          attributeName="width"
          values="0;42;84;126;168;210;252;294;336;378;420;462;504;546;588;630;672;714;756;798;840;882;924;966;987"
          keyTimes="0;0.04;0.075;0.11;0.16;0.20;0.24;0.28;0.32;0.37;0.42;0.45;0.49;0.54;0.58;0.62;0.65;0.69;0.73;0.78;0.82;0.86;0.91;0.96;1"
          calcMode="discrete"
          begin="2.6s"
          dur="2.9s"
          fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- 米白色终端卡片 -->
  <rect x="1" y="1"
        width="1178" height="453"
        rx="22"
        fill="#FAF8F5"
        stroke="#E8DED3"
        stroke-width="2"/>

  <!-- Claude 风格的星形标记 -->
  <g transform="translate(55 52)"
     stroke="#D97757"
     stroke-width="2.7"
     stroke-linecap="round">
    <path d="M0 -15 V15
             M-15 0 H15
             M-11 -11 L11 11
             M11 -11 L-11 11"/>
  </g>

  <!-- 顶部标题 -->
  <text x="88" y="61"
        font-family="monospace"
        font-size="23"
        font-weight="bold"
        fill="#302D2B">guoxu</text>

  <text x="1120" y="60"
        text-anchor="end"
        font-family="monospace"
        font-size="18"
        fill="#968A80">AI / Research</text>

  <!-- 顶部分隔线 -->
  <line x1="1" y1="98"
        x2="1179" y2="98"
        stroke="#E8DED3"
        stroke-width="1.5"/>

  <!-- 提示词箭头 -->
  <path d="M65 160 L77 174 L65 188"
        fill="none"
        stroke="#D97757"
        stroke-width="5"
        stroke-linecap="square"
        stroke-linejoin="miter"/>

  <!-- 用户提示 -->
  <text x="101" y="181"
        font-family="monospace"
        font-size="20"
        fill="#968A80">Introduce yourself</text>

  <!-- 第一行生成文本 -->
  <text x="72" y="272"
        font-family="monospace"
        font-size="37"
        font-weight="500"
        textLength="386"
        lengthAdjust="spacingAndGlyphs"
        fill="#4D463F"
        clip-path="url(#reveal1)">Hello! I'm guoxu.</text>

  <!-- 第二行生成文本 -->
  <text x="72" y="335"
        font-family="monospace"
        font-size="35"
        textLength="987"
        lengthAdjust="spacingAndGlyphs"
        fill="#4D463F"
        clip-path="url(#reveal2)">Exploring Speech Recognition, LLMs, and beyond.</text>

  <!-- 第一行移动光标 -->
  <rect x="72" y="237"
        width="3" height="43"
        fill="#D97757"
        visibility="hidden">

    <set attributeName="visibility"
         to="visible"
         begin="0.65s"
         dur="1.95s"/>

    <animate
      attributeName="x"
      values="72;117;163;208;254;299;344;390;413;435;458"
      keyTimes="0;0.09;0.18;0.27;0.39;0.48;0.56;0.68;0.81;0.92;1"
      calcMode="discrete"
      begin="0.65s"
      dur="1.65s"
      fill="freeze"/>

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.8s"
      begin="0.65s"
      repeatCount="indefinite"/>
  </rect>

  <!-- 第二行移动光标 -->
  <rect x="72" y="299"
        width="3" height="43"
        fill="#D97757"
        visibility="hidden">

    <set attributeName="visibility"
         to="visible"
         begin="2.6s"
         dur="3.05s"/>

    <animate
      attributeName="x"
      values="72;114;156;198;240;282;324;366;408;450;492;534;576;618;660;702;744;786;828;870;912;954;996;1038;1059"
      keyTimes="0;0.04;0.075;0.11;0.16;0.20;0.24;0.28;0.32;0.37;0.42;0.45;0.49;0.54;0.58;0.62;0.65;0.69;0.73;0.78;0.82;0.86;0.91;0.96;1"
      calcMode="discrete"
      begin="2.6s"
      dur="2.9s"
      fill="freeze"/>

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.8s"
      begin="2.6s"
      repeatCount="indefinite"/>
  </rect>

  <!-- 底部分隔线 -->
  <line x1="45" y1="389"
        x2="1135" y2="389"
        stroke="#E8DED3"
        stroke-width="1.5"/>

  <!-- 状态指示点 -->
  <circle cx="55" cy="425" r="5"
          fill="#D97757">

    <animate
      attributeName="opacity"
      values="1;0.4;1"
      dur="1.2s"
      begin="0s"
      repeatCount="4"
      fill="freeze"/>

    <set attributeName="fill"
         to="#96B69C"
         begin="5.65s"
         fill="freeze"/>
  </circle>

  <!-- 生成中状态 -->
  <text x="78" y="432"
        font-family="monospace"
        font-size="18"
        fill="#968A80">Generating...

    <set attributeName="visibility"
         to="hidden"
         begin="5.65s"
         fill="freeze"/>
  </text>

  <!-- 完成状态 -->
  <text x="78" y="432"
        font-family="monospace"
        font-size="18"
        fill="#968A80"
        visibility="hidden">Complete

    <set attributeName="visibility"
         to="visible"
         begin="5.65s"
         fill="freeze"/>
  </text>

  <!-- 右下角标识 -->
  <text x="1125" y="432"
        text-anchor="end"
        font-family="monospace"
        font-size="17"
        fill="#968A80">✳ Claude-inspired</text>

</svg>
