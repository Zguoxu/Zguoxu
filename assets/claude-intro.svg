<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="448" viewBox="0 0 1180 448"
     role="img" aria-label="guoxu introduction in a Claude Code terminal style">
  <title>guoxu - Claude Code style introduction</title>
  <style>
    text { font-family: "SF Mono", "Menlo", "Cascadia Mono", "DejaVu Sans Mono", "Consolas", monospace; }
  </style>

  <!-- 终端窗口 -->
  <rect x="1" y="1" width="1178" height="446" rx="14" fill="#1f1e1d" stroke="#3a3835" stroke-width="2"/>
  <path d="M1 15 a14 14 0 0 1 14 -14 H1165 a14 14 0 0 1 14 14 V36 H1 Z" fill="#2b2a28"/>
  <line x1="1" y1="36" x2="1179" y2="36" stroke="#3a3835" stroke-width="1.5"/>
  <circle cx="28" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="18" r="6" fill="#febc2e"/>
  <circle cx="72" cy="18" r="6" fill="#28c840"/>
  <text x="590" y="23" font-size="14" fill="#8c887f" text-anchor="middle">claude — guoxu</text>

  <!-- 欢迎框 -->
  <rect x="32" y="56" width="640" height="118" rx="10" fill="none" stroke="#d77757" stroke-width="1.6"/>
  
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;0 -4;0 0" keyTimes="0;0.5;1" calcMode="spline"
                      keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.4s" repeatCount="indefinite"/>
    <g fill="#d77757">
      <rect x="69" y="88" width="63" height="7"/><rect x="62" y="95" width="77" height="7"/><rect x="62" y="102" width="77" height="7"/><rect x="69" y="109" width="63" height="7"/>
      <rect x="76" y="116" width="7" height="7"/><rect x="83" y="116" width="7" height="7"/><rect x="111" y="116" width="7" height="7"/><rect x="118" y="116" width="7" height="7"/>
    </g>
    <g fill="#1f1e1d">
      <rect x="83" y="95" width="7" height="7"/><rect x="111" y="95" width="7" height="7"/>
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1"
               dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>
  
  <g transform="translate(184 90)" stroke="#d77757" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M0 -10 V10 M-10 0 H10 M-7.199999999999999 -7.199999999999999 L7.199999999999999 7.199999999999999 M7.199999999999999 -7.199999999999999 L-7.199999999999999 7.199999999999999"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <text x="208" y="97" font-size="22" font-weight="bold" fill="#ebe9e1">Welcome to guoxu's README!</text>
  <text x="172" y="128" font-size="17" fill="#8c887f">/help for help, /about for more</text>
  <text x="172" y="154" font-size="17" fill="#8c887f">cwd: ~/Zguoxu</text>

  <!-- 用户输入 -->
  <rect x="32" y="192" width="1116" height="40" rx="6" fill="#2f2e2c"/>
  <text x="48" y="219" font-size="22" fill="#8c887f">&gt;</text>
  
  <clipPath id="p">
    <rect x="76" y="195" width="0" height="34">
      <animate attributeName="width" values="0;13.2;26.4;39.6;52.8;66;79.2;92.4;105.6;118.8;132;145.2;158.4;171.6;184.8;198;211.2;224.4;237.6" keyTimes="0;0.0556;0.1111;0.1667;0.2222;0.2778;0.3333;0.3889;0.4444;0.5;0.5556;0.6111;0.6667;0.7222;0.7778;0.8333;0.8889;0.9444;1"
               calcMode="discrete" begin="0.4s" dur="0.72s" fill="freeze"/>
    </rect>
  </clipPath>
  <text x="76" y="219" font-size="22" font-weight="400" fill="#ebe9e1"
        textLength="237.6" lengthAdjust="spacing" clip-path="url(#p)">Introduce yourself</text>
  <rect x="76" y="199" width="13.2" height="27" fill="#ebe9e1" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.4s" dur="0.72s"/>
    <animate attributeName="x" values="76;89.2;102.4;115.6;128.8;142;155.2;168.4;181.6;194.8;208;221.2;234.4;247.6;260.8;274;287.2;300.4;313.6" keyTimes="0;0.0556;0.1111;0.1667;0.2222;0.2778;0.3333;0.3889;0.4444;0.5;0.5556;0.6111;0.6667;0.7222;0.7778;0.8333;0.8889;0.9444;1"
             calcMode="discrete" begin="0.4s" dur="0.72s" fill="freeze"/>
  </rect>

  <!-- 回复 -->
  <circle cx="52" cy="267" r="6" fill="#4eba65" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="1.62s" fill="freeze"/>
  </circle>
  
  <clipPath id="r1">
    <rect x="76" y="250" width="0" height="34">
      <animate attributeName="width" values="0;13.2;26.4;39.6;52.8;66;79.2;92.4;105.6;118.8;132;145.2;158.4;171.6;184.8;198;211.2;224.4" keyTimes="0;0.0588;0.1176;0.1765;0.2353;0.2941;0.3529;0.4118;0.4706;0.5294;0.5882;0.6471;0.7059;0.7647;0.8235;0.8824;0.9412;1"
               calcMode="discrete" begin="1.62s" dur="1.02s" fill="freeze"/>
    </rect>
  </clipPath>
  <text x="76" y="274" font-size="22" font-weight="400" fill="#ebe9e1"
        textLength="224.39999999999998" lengthAdjust="spacing" clip-path="url(#r1)">Hello! I'm guoxu.</text>
  <rect x="76" y="254" width="13.2" height="27" fill="#ebe9e1" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="1.62s" dur="1.02s"/>
    <animate attributeName="x" values="76;89.2;102.4;115.6;128.8;142;155.2;168.4;181.6;194.8;208;221.2;234.4;247.6;260.8;274;287.2;300.4" keyTimes="0;0.0588;0.1176;0.1765;0.2353;0.2941;0.3529;0.4118;0.4706;0.5294;0.5882;0.6471;0.7059;0.7647;0.8235;0.8824;0.9412;1"
             calcMode="discrete" begin="1.62s" dur="1.02s" fill="freeze"/>
  </rect>
  
  <clipPath id="r2">
    <rect x="76" y="286" width="0" height="34">
      <animate attributeName="width" values="0;13.2;26.4;39.6;52.8;66;79.2;92.4;105.6;118.8;132;145.2;158.4;171.6;184.8;198;211.2;224.4;237.6;250.8;264;277.2;290.4;303.6;316.8;330;343.2;356.4;369.6;382.8;396;409.2;422.4;435.6;448.8;462;475.2;488.4;501.6;514.8;528;541.2;554.4;567.6;580.8;594;607.2;620.4" keyTimes="0;0.0213;0.0426;0.0638;0.0851;0.1064;0.1277;0.1489;0.1702;0.1915;0.2128;0.234;0.2553;0.2766;0.2979;0.3191;0.3404;0.3617;0.383;0.4043;0.4255;0.4468;0.4681;0.4894;0.5106;0.5319;0.5532;0.5745;0.5957;0.617;0.6383;0.6596;0.6809;0.7021;0.7234;0.7447;0.766;0.7872;0.8085;0.8298;0.8511;0.8723;0.8936;0.9149;0.9362;0.9574;0.9787;1"
               calcMode="discrete" begin="2.89s" dur="2.35s" fill="freeze"/>
    </rect>
  </clipPath>
  <text x="76" y="310" font-size="22" font-weight="400" fill="#ebe9e1"
        textLength="620.4" lengthAdjust="spacing" clip-path="url(#r2)">Exploring Speech Recognition, LLMs, and beyond.</text>
  <rect x="76" y="290" width="13.2" height="27" fill="#ebe9e1" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="2.89s" dur="2.35s"/>
    <animate attributeName="x" values="76;89.2;102.4;115.6;128.8;142;155.2;168.4;181.6;194.8;208;221.2;234.4;247.6;260.8;274;287.2;300.4;313.6;326.8;340;353.2;366.4;379.6;392.8;406;419.2;432.4;445.6;458.8;472;485.2;498.4;511.6;524.8;538;551.2;564.4;577.6;590.8;604;617.2;630.4;643.6;656.8;670;683.2;696.4" keyTimes="0;0.0213;0.0426;0.0638;0.0851;0.1064;0.1277;0.1489;0.1702;0.1915;0.2128;0.234;0.2553;0.2766;0.2979;0.3191;0.3404;0.3617;0.383;0.4043;0.4255;0.4468;0.4681;0.4894;0.5106;0.5319;0.5532;0.5745;0.5957;0.617;0.6383;0.6596;0.6809;0.7021;0.7234;0.7447;0.766;0.7872;0.8085;0.8298;0.8511;0.8723;0.8936;0.9149;0.9362;0.9574;0.9787;1"
             calcMode="discrete" begin="2.89s" dur="2.35s" fill="freeze"/>
  </rect>

  <!-- 状态行:生成中 -> 完成 -->
  <g visibility="hidden">
    <set attributeName="visibility" to="visible" begin="1.62s"/>
    <set attributeName="visibility" to="hidden" begin="5.24s" fill="freeze"/>
    
  <g transform="translate(52 352)" stroke="#d77757" stroke-width="2.6" stroke-linecap="round" fill="none">
    <path d="M0 -8 V8 M-8 0 H8 M-5.76 -5.76 L5.76 5.76 M5.76 -5.76 L-5.76 5.76"/>
    <animateTransform attributeName="transform" type="rotate" values="0;45" dur="1.2s" repeatCount="indefinite"/>
  </g>
    <text x="76" y="359" font-size="17" fill="#d77757">Generating…</text>
    <text x="208" y="359" font-size="17" fill="#8c887f">(esc to interrupt)</text>
  </g>
  <g visibility="hidden">
    <set attributeName="visibility" to="visible" begin="5.24s" fill="freeze"/>
    <circle cx="52" cy="352" r="5" fill="#4eba65"/>
    <text x="76" y="359" font-size="17" fill="#4eba65">Complete</text>
  </g>

  <!-- 底部输入框 -->
  <rect x="32" y="378" width="1116" height="40" rx="8" fill="none" stroke="#3a3835" stroke-width="1.6"/>
  <text x="48" y="405" font-size="22" fill="#8c887f">&gt;</text>
  <rect x="76" y="385" width="13.2" height="26" fill="#ebe9e1" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="5.24s"/>
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="5.24s" repeatCount="indefinite"/>
  </rect>
  <text x="34" y="437" font-size="14" fill="#8c887f">? for shortcuts</text></svg>
