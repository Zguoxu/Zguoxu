
<svg xmlns="http://www.w3.org/2000/svg"
     width="1180"
     height="320"
     viewBox="0 0 1180 320"
     role="img"
     aria-label="guoxu AI research introduction">

  <title>guoxu - Claude inspired introduction</title>

  <style>
    text {
      font-family:
        "Anthropic Mono",
        "SF Mono",
        "Menlo",
        "Consolas",
        monospace;
    }
  </style>

  <defs>

    <!-- 第一行流式生成 -->
    <clipPath id="reveal1">
      <rect x="72" y="139" width="0" height="48">
        <animate
          attributeName="width"
          values="0;45;91;136;182;227;272;318;341;363;386"
          keyTimes="0;0.09;0.18;0.27;0.39;0.48;0.56;0.68;0.81;0.92;1"
          calcMode="discrete"
          begin="0.65s"
          dur="1.65s"
          fill="freeze"/>
      </rect>
    </clipPath>

    <!-- 第二行流式生成 -->
    <clipPath id="reveal2">
      <rect x="72" y="190" width="0" height="48">
        <animate
          attributeName="width"
          values="0;42;84;126;168;210;252;294;336;378;420;462;504;546;588;630;672;714;756;798;840;882;924;966;987"
          keyTimes="0;0.04;0.075;0.11;0.16;0.20;0.24;0.28;0.32;0.37;0.42;0.45;0.49;0.54;0.58;0.62;0.65;0.69;0.73;0.78;0.82;0.86;0.91;0.96;1"
          calcMode="discrete"
          begin="2.6s"
          dur="2.9s"
          fill="freeze"/>
      </rect>
    </clipPath>

  </defs>

  <!-- 背景 -->
  <rect x="1" y="1"
        width="1178" height="318"
        rx="20"
        fill="#FAF8F5"
        stroke="#E8DED3"
        stroke-width="2"/>

  <!-- Claude 风格动态星芒 -->
  <g transform="translate(55 39)">

    <g stroke="#D97757"
       stroke-width="2.7"
       stroke-linecap="round"
       fill="none">

      <path d="
        M0 -15 V15
        M-15 0 H15
        M-11 -11 L11 11
        M11 -11 L-11 11
      "/>

      <animate
        attributeName="opacity"
        values="1;0.55;1;0.82;1"
        keyTimes="0;0.4;0.53;0.77;1"
        dur="2.4s"
        repeatCount="indefinite"/>

      <animate
        attributeName="stroke"
        values="#D97757;#D97757;#F0A080;#D97757;#D97757"
        keyTimes="0;0.4;0.53;0.77;1"
        dur="2.4s"
        repeatCount="indefinite"/>

      <animateTransform
        attributeName="transform"
        type="scale"
        values="1;0.96;1.10;1.02;1"
        keyTimes="0;0.4;0.53;0.77;1"
        dur="2.4s"
        repeatCount="indefinite"/>

    </g>
  </g>

  <!-- 顶部用户名 -->
  <text x="88" y="49"
        font-size="23"
        font-weight="bold"
        fill="#302D2B">guoxu</text>

  <!-- 顶部分隔线 -->
  <line x1="1" y1="72"
        x2="1179" y2="72"
        stroke="#E8DED3"
        stroke-width="1.5"/>

  <!-- 提示词箭头 -->
  <path d="M65 100 L77 113 L65 126"
        fill="none"
        stroke="#D97757"
        stroke-width="5"
        stroke-linecap="square"
        stroke-linejoin="miter"/>

  <!-- 用户提示 -->
  <text x="101" y="121"
        font-size="20"
        fill="#968A80">Introduce yourself</text>

  <!-- 第一行文字 -->
  <text x="72" y="177"
        font-size="37"
        font-weight="500"
        textLength="386"
        lengthAdjust="spacingAndGlyphs"
        fill="#4D463F"
        clip-path="url(#reveal1)">Hello! I'm guoxu.</text>

  <!-- 第二行文字 -->
  <text x="72" y="229"
        font-size="35"
        textLength="987"
        lengthAdjust="spacingAndGlyphs"
        fill="#4D463F"
        clip-path="url(#reveal2)">Exploring Speech Recognition, LLMs, and beyond.</text>

  <!-- 第一行光标 -->
  <rect x="72" y="143"
        width="3" height="39"
        fill="#D97757"
        visibility="hidden">

    <set attributeName="visibility"
         to="visible"
         begin="0.65s"
         dur="1.65s"/>

    <animate
      attributeName="x"
      values="72;117;163;208;254;299;344;390;413;435;458"
      keyTimes="0;0.09;0.18;0.27;0.39;0.48;0.56;0.68;0.81;0.92;1"
      calcMode="discrete"
      begin="0.65s"
      dur="1.65s"
      fill="freeze"/>

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.8s"
      begin="0.65s"
      repeatCount="indefinite"/>

  </rect>

  <!-- 第二行光标 -->
  <rect x="72" y="195"
        width="3" height="39"
        fill="#D97757"
        visibility="hidden">

    <set attributeName="visibility"
         to="visible"
         begin="2.6s"
         dur="2.9s"/>

    <animate
      attributeName="x"
      values="72;114;156;198;240;282;324;366;408;450;492;534;576;618;660;702;744;786;828;870;912;954;996;1038;1059"
      keyTimes="0;0.04;0.075;0.11;0.16;0.20;0.24;0.28;0.32;0.37;0.42;0.45;0.49;0.54;0.58;0.62;0.65;0.69;0.73;0.78;0.82;0.86;0.91;0.96;1"
      calcMode="discrete"
      begin="2.6s"
      dur="2.9s"
      fill="freeze"/>

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.8s"
      begin="2.6s"
      repeatCount="indefinite"/>

  </rect>

  <!-- 底部分隔线 -->
  <line x1="45" y1="273"
        x2="1135" y2="273"
        stroke="#E8DED3"
        stroke-width="1.5"/>

  <!-- 状态指示灯 -->
  <circle cx="55" cy="296" r="5"
          fill="#D97757">

    <animate
      attributeName="opacity"
      values="1;0.4;1"
      dur="1.2s"
      begin="0s"
      repeatCount="4"/>

    <set attributeName="fill"
         to="#96B69C"
         begin="5.65s"
         fill="freeze"/>
  </circle>

  <!-- 生成中状态 -->
  <text x="78" y="302"
        font-size="18"
        fill="#968A80">Generating...

    <set attributeName="visibility"
         to="hidden"
         begin="5.65s"
         fill="freeze"/>
  </text>

  <!-- 完成状态 -->
  <text x="78" y="302"
        font-size="18"
        fill="#968A80"
        visibility="hidden">Complete

    <set attributeName="visibility"
         to="visible"
         begin="5.65s"
         fill="freeze"/>
  </text>

</svg>
