
<svg xmlns="http://www.w3.org/2000/svg"
     width="940" height="150"
     viewBox="0 0 940 150"
     role="img">

  <title>guoxu introduction animation</title>

  <defs>
    <!-- 第一行：分块输出 -->
    <clipPath id="line1">
      <rect x="55" y="18" width="0" height="52">
        <animate
          attributeName="width"
          values="0;40;80;120;160;200;240;280;320;355"
          dur="1.8s"
          begin="0.4s"
          calcMode="discrete"
          fill="freeze"/>
      </rect>
    </clipPath>

    <!-- 第二行：稍后开始生成 -->
    <clipPath id="line2">
      <rect x="55" y="83" width="0" height="42">
        <animate
          attributeName="width"
          values="0;40;80;120;160;200;240;280;320;360;400;440;480;520;560;600;640;680;715"
          dur="2.9s"
          begin="2.5s"
          calcMode="discrete"
          fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Claude 风格装饰 -->
  <text x="13" y="60" font-size="31" fill="#D97757">✳</text>

  <!-- 第一行 -->
  <text x="55" y="60"
        font-family="monospace"
        font-size="34"
        fill="#D97757"
        clip-path="url(#line1)">
    Hello! I'm guoxu.
  </text>

  <!-- 第二行 -->
  <text x="55" y="112"
        font-family="monospace"
        font-size="25"
        fill="#D97757"
        clip-path="url(#line2)">
    Exploring Speech Recognition, LLMs, and beyond.
  </text>

  <!-- 第一行光标 -->
  <rect x="55" y="31" width="3" height="34"
        fill="#D97757">
    <animate attributeName="x"
             from="55" to="410"
             begin="0.4s" dur="1.8s"
             fill="freeze"/>
    <set attributeName="visibility"
         to="hidden" begin="2.2s"
         fill="freeze"/>
  </rect>

  <!-- 第二行光标 -->
  <rect x="55" y="88" width="3" height="29"
        fill="#D97757"
        visibility="hidden">

    <set attributeName="visibility"
         to="visible" begin="2.5s"
         fill="freeze"/>

    <animate attributeName="x"
             from="55" to="770"
             begin="2.5s" dur="2.9s"
             fill="freeze"/>

    <animate attributeName="opacity"
             values="1;0;1"
             dur="0.8s"
             repeatCount="indefinite"/>
  </rect>

</svg>
